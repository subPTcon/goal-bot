# goal-bot example configuration
#
# Usage:
#   bash goal-bot.sh example-goal.yaml
#
# Required fields:
#   goal.description
#   setup.command
#   evaluate.command
#
# The current runner uses Claude Code through `claude -p`.

goal:
  name: "JSON Parser in C"
  description: |
    Implement an RFC 8259 compliant JSON validator from scratch in pure C (C11 standard).

    ## Requirements
    - Read input from stdin, determine whether it is valid JSON
    - Valid JSON: exit code 0
    - Invalid JSON: exit code 1
    - No third-party libraries. No calls to system(), exec(), or eval-like functions
    - All source code must be placed in the src/ directory

    ## Reference
    - The JSON specification is available at spec/RFC8259.txt
    - Test data is in tests/level1/ through tests/level6/. Filename prefix conventions:
      - y_ prefix: valid JSON, your program must accept (exit 0)
      - n_ prefix: invalid JSON, your program must reject (nonzero exit)
      - i_ prefix: implementation-defined edge cases, must not crash
    - The 6 levels, from easy to hard:
      - level1: Basic value types (true/false/null/number/string/empty containers)
      - level2: Array and object nesting, comma/colon/bracket matching
      - level3: String escapes, Unicode \uXXXX, surrogate pairs
      - level4: Number formats (scientific notation, leading zeros, illegal formats)
      - level5: Strict rejection of non-standard extensions (comments, trailing commas, invalid UTF-8)
      - level6: Multi-byte UTF-8 sequences, deep nesting without crashing, extreme numbers

    ## Build
    gcc -std=c11 -o json_parser src/*.c -Wall -Werror -fsanitize=address,undefined

    ## Self-test
    You can run bash run_tests.sh at any time to check your current pass rate.
    Run a single level: bash run_tests.sh 1
    Run a range: bash run_tests.sh 1 3

setup:
  command: "gcc -std=c11 -o json_parser src/*.c -Wall -Werror -fsanitize=address,undefined"

evaluate:
  command: "bash run_tests.sh"

config:
  # Maximum outer setup/evaluate/fix loop iterations.
  max_iterations: 30

  # Fallback Claude turn limit if the specific limits below are omitted.
  max_turns_per_iteration: 100

  # Claude turn limit for the first implementation attempt.
  max_turns_initial: 8

  # Claude turn limit for each failure-feedback attempt.
  max_turns_feedback: 6

  # Kill a Claude call if its stream output stops growing for this many seconds.
  # Set to 0 to disable idle timeout.
  claude_idle_timeout_seconds: 90

  # Directory where Claude, setup.command, and evaluate.command run.
  working_dir: ./benchmarks/json-parser

  # Passed to `claude --model`. Remove this field to use Claude Code's default.
  model: sonnet
